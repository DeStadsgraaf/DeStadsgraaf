<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b91c1c"><link rel="manifest" href="manifest.json">
<title>De Stadsgraaf – Checklist</title>
<style>
:root{--red:#b91c1c;--dark:#171717;--bg:#f5f5f4;--line:#e5e5e5;--green:#15803d;--muted:#737373}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
header{background:linear-gradient(135deg,#991b1b,#b91c1c);color:#fff;padding:22px max(18px,calc((100vw - 1050px)/2));box-shadow:0 2px 12px #0002}.head{max-width:1050px;margin:auto;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:14px;background:#fff;color:var(--red);display:grid;place-items:center;font-weight:900;font-size:23px}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0 0;font-size:13px;opacity:.85}.date{text-align:right;font-size:13px}
main{max-width:1050px;margin:20px auto;padding:0 16px 50px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.tab,.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font-weight:750}.tab.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px #0000000b}.summary{display:flex;gap:15px;align-items:center}.progress{flex:1}.pl{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:8px}.bar{height:10px;background:#eee;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);transition:.2s}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:var(--red);color:#fff;border-color:var(--red)}.danger{color:var(--red)}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:11px;padding:11px 13px}.select{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fff}
.title{font-size:18px;font-weight:900}.sectionhead{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.count{font-size:12px;color:var(--muted);font-weight:700}.task{display:flex;align-items:center;gap:12px;border-top:1px solid #eee;padding:13px 2px}.task:first-child{border-top:0}.check{appearance:none;width:27px;height:27px;min-width:27px;border:2px solid #bbb;border-radius:8px;background:#fff;display:grid;place-items:center}.check:checked{background:var(--green);border-color:var(--green)}.check:checked:after{content:'✓';color:#fff;font-weight:900}.taskmain{flex:1}.name{font-weight:750}.note{font-size:12px;color:var(--muted);margin-top:2px}.done .name{text-decoration:line-through;color:#888}.icons{display:flex;gap:4px}.icon{border:0;background:transparent;padding:7px;border-radius:8px}.icon:hover{background:#f1f1f1}.hint,.footer{font-size:12px;color:var(--muted);line-height:1.5}.footer{text-align:center;margin-top:20px}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:12px;z-index:5}.modal.show{display:flex}.dialog{background:#fff;width:min(560px,100%);border-radius:20px;padding:20px}.field{margin:0 0 12px}.field label{display:block;font-weight:750;font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;border:1px solid #d4d4d4;border-radius:11px;padding:11px}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,120px);background:#171717;color:#fff;padding:11px 15px;border-radius:12px;transition:.25s;z-index:10}.toast.show{transform:translate(-50%,0)}
@media(max-width:600px){.summary{align-items:stretch;flex-direction:column}.summary .btn{flex:1}.task .edit{display:none}.date{font-size:11px}}
</style></head>
<body>
<header><div class="head"><div class="brand"><div class="logo">DS</div><div><h1>De Stadsgraaf</h1><p>Opening · Closing · Schoonmaak</p></div></div><div class="date" id="date"></div></div></header>
<main>
<nav class="tabs"><button class="tab active" data-tab="opening">🌅 Opening</button><button class="tab" data-tab="closing">🔒 Closing</button><button class="tab" data-tab="cleaning">🧹 Schoonmaak</button></nav>
<section class="card summary"><div class="progress"><div class="pl"><span id="progressText">0 van 0 taken klaar</span><span id="percent">0%</span></div><div class="bar"><i id="bar" style="width:0%"></i></div></div><div class="actions"><button class="btn" id="reset">↺ Reset</button><button class="btn primary" id="add">＋ Taak toevoegen</button></div></section>
<section class="card"><div class="toolbar"><input class="search" id="search" placeholder="Zoek in taken…"><select class="select" id="filter"><option value="all">Alle taken</option><option value="open">Nog te doen</option><option value="done">Afgerond</option></select></div></section>
<section class="card"><div class="sectionhead"><div class="title" id="listTitle">Opening</div><div class="count" id="count"></div></div><div id="list"></div></section>
<section class="card"><div class="title">Beheer & back-up</div><p class="hint">De checklist wordt centraal opgeslagen zodra Supabase is gekoppeld. Export/import blijft beschikbaar als extra back-up.</p><div class="actions"><button class="btn" id="export">⬇ Export</button><button class="btn" id="import">⬆ Import</button><input type="file" id="file" accept="application/json" hidden></div></section>
<div class="footer">De Stadsgraaf Checklist · gratis webapp</div>
</main>
<div class="modal" id="modal"><div class="dialog"><h2 id="mtitle">Taak toevoegen</h2><div class="field"><label>Taak *</label><input id="name" maxlength="120" placeholder="Bijv. Tapinstallatie controleren"></div><div class="field"><label>Opmerking</label><input id="note" maxlength="200" placeholder="Optioneel"></div><div class="field"><label>Onderdeel</label><select id="cat"><option value="opening">Opening</option><option value="closing">Closing</option><option value="cleaning">Schoonmaak</option></select></div><div class="modalactions"><button class="btn" id="cancel">Annuleren</button><button class="btn primary" id="save">Opslaan</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='stadsgraaf-checklist-v2';
const SUPABASE_URL='https://munmhgczqhoxjxuiaudf.supabase.co';
const SUPABASE_KEY='jouw-publishable-key-hier';
const SB_HEADERS={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
let remote=false;
async function sb(path,options={}){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers:{...SB_HEADERS,...(options.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function pullRemote(){if(SUPABASE_KEY==='const SUPABASE_KEY='sb_publishable_uWMNmgyd0zS0rAGu0Y3hpg_jeA0FM94';')return;try{const rows=await sb('checklist_tasks?select=id,category,name,note,sort_order&order=sort_order.asc');if(Array.isArray(rows)&&rows.length){tasks=rows.map(x=>({id:String(x.id),cat:x.category,name:x.name,note:x.note||''}));persist();}const c=await sb('checklist_checks?select=task_id,checked&check_date=eq.'+today());checks={};(c||[]).forEach(x=>checks[x.task_id]=x.checked);remote=true;render()}catch(e){remote=false}}
async function pushTask(t){if(!remote)return;try{await sb('checklist_tasks?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:t.id,category:t.cat,name:t.name,note:t.note||'',sort_order:tasks.findIndex(x=>x.id===t.id)})})}catch(e){}}
async function deleteRemote(id){if(!remote)return;try{await sb('checklist_tasks?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}})}catch(e){}}
async function pushCheck(id,value){if(!remote)return;try{await sb('checklist_checks?on_conflict=task_id,check_date',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({task_id:id,check_date:today(),checked:value})})}catch(e){}}

const defaults=[
['o1','opening','Deuren en verlichting openen','Entree, zaal en toiletverlichting controleren'],['o2','opening','Bar en tapinstallatie controleren','Tap, koelingen en werkblad'],['o3','opening','Kassa / betaalterminal opstarten',''],['o4','opening','Koelkasten en voorraad controleren',''],['o5','opening','Toiletten controleren en aanvullen',''],['o6','opening','Muziek / PA / apparatuur controleren',''],['o7','opening','Terras controleren en klaarzetten',''],['o8','opening','Entree en stoep controleren',''],
['c1','closing','Kassa afsluiten en geld veiligstellen',''],['c2','closing','Tapinstallatie afsluiten','Leidingen / afsluiters controleren'],['c3','closing','Koelkasten en apparatuur controleren',''],['c4','closing','Terras opruimen en controleren',''],['c5','closing','Ramen, deuren en nooduitgangen controleren',''],['c6','closing','Muziek / PA / verlichting uitschakelen',''],['c7','closing','Afval verzamelen en wegzetten',''],['c8','closing','Pand afsluiten',''],
['s1','cleaning','Barblad en werkoppervlakken reinigen',''],['s2','cleaning','Glazen wassen en opruimen',''],['s3','cleaning','Tafels en stoelen reinigen',''],['s4','cleaning','Vloer vegen / stofzuigen',''],['s5','cleaning','Vloer dweilen',''],['s6','cleaning','Toiletten reinigen',''],['s7','cleaning','Spiegels en wastafels reinigen',''],['s8','cleaning','Afvalbakken legen en nieuwe zakken plaatsen','']];
let tasks=loadTasks(),checks=loadChecks(),tab='opening',edit=null;
const $=x=>document.getElementById(x);
function loadTasks(){try{let x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x))return x}catch(e){}return defaults.map(([id,cat,name,note])=>({id,cat,name,note}))}
function loadChecks(){try{let x=JSON.parse(localStorage.getItem(KEY+'-checks'));if(x.date===today())return x.data||{}}catch(e){}return {}}
function today(){return new Date().toLocaleDateString('sv-SE')}
function persist(){localStorage.setItem(KEY,JSON.stringify(tasks));localStorage.setItem(KEY+'-checks',JSON.stringify({date:today(),data:checks}))}
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function render(){let q=$('search').value.toLowerCase(),f=$('filter').value,all=tasks.filter(t=>t.cat===tab),visible=all.filter(t=>(t.name+' '+t.note).toLowerCase().includes(q)&&(f==='all'||(f==='done'?checks[t.id]:!checks[t.id]))),done=all.filter(t=>checks[t.id]).length,p=all.length?Math.round(done/all.length*100):0;
$('listTitle').textContent={opening:'Opening',closing:'Closing',cleaning:'Schoonmaak'}[tab];$('progressText').textContent=done+' van '+all.length+' taken klaar';$('percent').textContent=p+'%';$('bar').style.width=p+'%';$('count').textContent=visible.length+' zichtbaar';
$('list').innerHTML=visible.length?visible.map(t=>'<div class="task '+(checks[t.id]?'done':'')+'"><input class="check" type="checkbox" '+(checks[t.id]?'checked':'')+' data-check="'+t.id+'"><div class="taskmain"><div class="name">'+esc(t.name)+'</div>'+(t.note?'<div class="note">'+esc(t.note)+'</div>':'')+'</div><div class="icons"><button class="icon edit" data-edit="'+t.id+'">✎</button><button class="icon" data-del="'+t.id+'">🗑</button></div></div>').join(''):'<div class="hint">Geen taken gevonden.</div>'}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});
$('search').oninput=render;$('filter').onchange=render;
$('list').onclick=e=>{let c=e.target.closest('[data-check]'),d=e.target.closest('[data-del]'),ed=e.target.closest('[data-edit]');if(c){checks[c.dataset.check]=c.checked;persist();render();return}if(d){let t=tasks.find(x=>x.id===d.dataset.del);if(t&&confirm('Taak verwijderen?')){tasks=tasks.filter(x=>x.id!==t.id);delete checks[t.id];persist();render();toast('Taak verwijderd')}}if(ed){let t=tasks.find(x=>x.id===ed.dataset.edit);if(t)openModal(t)}};
function openModal(t){edit=t||null;$('mtitle').textContent=t?'Taak bewerken':'Taak toevoegen';$('name').value=t?.name||'';$('note').value=t?.note||'';$('cat').value=t?.cat||tab;$('modal').classList.add('show');setTimeout(()=>$('name').focus(),50)}
$('add').onclick=()=>openModal();$('cancel').onclick=()=>$('modal').classList.remove('show');
$('save').onclick=()=>{let name=$('name').value.trim();if(!name)return toast('Vul een taak in.');if(edit){Object.assign(edit,{name,note:$('note').value.trim(),cat:$('cat').value})}else tasks.push({id:crypto.randomUUID(),name,note:$('note').value.trim(),cat:$('cat').value});persist();$('modal').classList.remove('show');tab=$('cat').value;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render();toast(edit?'Taak aangepast':'Taak toegevoegd');edit=null};
$('reset').onclick=()=>{if(confirm('Alle vinkjes van vandaag resetten?')){checks={};persist();render();toast('Checklist gereset')}};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({tasks,checks,date:today()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='stadsgraaf-checklist-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)};
$('import').onclick=()=>$('file').click();$('file').onchange=e=>{let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.tasks))throw 0;tasks=x.tasks;checks=x.checks||{};persist();render();toast('Back-up geïmporteerd')}catch(e){toast('Ongeldig back-upbestand')}};r.readAsText(e.target.files[0])};
$('date').textContent=new Date().toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
